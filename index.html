<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>اسمك في الذكر - Hanin</title><style>body{background:#0a1931;color:#fff;font-family:sans-serif;display:flex;justify-content:center;align-items:center;min-height:100vh;margin:0}.card{background:#112240;border:2px solid #d4af37;border-radius:20px;padding:30px;text-align:center;width:90%;max-width:400px}h1{color:#d4af37}#count{font-size:48px;color:#d4af37;font-weight:bold;margin:15px}.input-box{width:100%;padding:12px;border-radius:10px;border:1px solid #d4af37;background:#0a1931;color:#fff;text-align:center;margin:10px 0}button{background:#d4af37;color:#0a1931;border:none;padding:12px;border-radius:30px;font-weight:bold;width:100%;margin-top:10px;cursor:pointer}.res{background:#fff;color:#0a1931;padding:15px;border-radius:10px;margin-top:15px;display:none}</style></head><body><div class="card"><h1>HANIN PRO</h1><p>بواسطة حنين - 14 سنة - من مصر</p><p style="color:#8892b0">مشروعي لمنحة كوريا GKS</p><div style="font-size:50px;background:#0a192f;width:110px;height:110px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:20px auto;border:3px solid #d4af37">📿</div><div id="count">0</div><input id="userName" class="input-box" placeholder="اكتبي اسمك هنا: حنين"><button onclick="c++;document.getElementById('count').innerText=c">سبحي - اضغطي هنا</button><button onclick="let n=document.getElementById('userName').value;if(!n)return alert('اكتبي اسمك!');let r=document.getElementById('res');r.style.display='block';r.innerText='يا '+n+' سبحتِ '+c+' تسبيحة - جعلك الله من الذاكرات ❤️'" style="background:transparent;border:1px solid #d4af37;color:#d4af37">✨ اصنعي كارت باسمك</button><div id="res" class="res"></div></div><script>let c=0;</script></body></html>
